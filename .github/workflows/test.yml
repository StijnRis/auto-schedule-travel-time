name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check syntax of the Apps Script files
        run: for f in src/*.gs; do node --check --input-type=commonjs < "$f" || exit 1; done
      - name: Run tests
        run: npm test
